name: qwenpaw-keepalive
on:
  schedule:
    - cron: "23 */4 * * *"     # 每 4 小时（容忍 GitHub 调度跳过）
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: qwenpaw-keepalive
  cancel-in-progress: false
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "acc1"
    steps:
      - uses: actions/checkout@v4
      - name: Run keepalive (${{ matrix.id }})
        env:
          QP_ACCOUNT: ${{ matrix.id == 'acc1' && secrets.QP1_ACCOUNT || secrets.QP2_ACCOUNT }}
          QP_PASSWORD: ${{ matrix.id == 'acc1' && secrets.QP1_PASSWORD || secrets.QP2_PASSWORD }}
        run: python3 keepalive.py
      - name: Keep repository active
        if: matrix.id == 'acc1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-run
          git add .last-run
          git commit -m "keepalive timestamp" || echo "nothing to commit"
          git push
name: qwenpaw-keepalive
on:
  schedule:
    - cron: "23 */6 * * *"     # 每 6 小时
  workflow_dispatch: {}         # 支持手动触发
permissions:                    # 授予内置 token 提交权限（自动防停用必需）
  contents: write
concurrency:
  group: qwenpaw-keepalive
  cancel-in-progress: false
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "acc1"
          # - id: "acc2"       # 多台沙箱按此扩展，并补充 Secrets：QP2_ACCOUNT / QP2_PASSWORD
    steps:
      - uses: actions/checkout@v4
      - name: Run keepalive (${{ matrix.id }})
        env:
          QP_ACCOUNT: ${{ matrix.id == 'acc1' && secrets.QP1_ACCOUNT || secrets.QP2_ACCOUNT }}
          QP_PASSWORD: ${{ matrix.id == 'acc1' && secrets.QP1_PASSWORD || secrets.QP2_PASSWORD }}
        run: python3 keepalive.py
      - name: Keep repository active
        if: matrix.id == 'acc1'   # 并行 job 只需一个提交，避免冲突
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-run
          git add .last-run
          git commit -m "keepalive timestamp" || echo "nothing to commit"
          git push
