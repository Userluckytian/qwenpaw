name: url-pinger
on:
  schedule:
    - cron: "7 */3 * * *"      # 每 3 小时启动一个 job，与上一棒无缝衔接
  workflow_dispatch: {}         # 支持手动触发
concurrency:
  group: url-pinger
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 210       # 上限 3.5 小时，比内部循环略宽
    steps:
      - name: Ping 3 URLs every 3 minutes
        run: |
          URLS=(
            "https://npc-tunnel-client.app.workbuddy.host/?sharecode=EREAFNURUR"
            "https://aa6fdf0bbd8ec5018.app.workbuddy.host/?sharecode=2YGOCFSQFH"
            "https://url-fetch-proxy.app.workbuddy.host/?sharecode=URA34JXSBU"
          )
          END=$((SECONDS + 10800))   # 跑满 3 小时后退出，下一棒接上
          while [ $SECONDS -lt $END ]; do
            ts=$(date -u +"%F %T")
            for u in "${URLS[@]}"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$u")
              echo "$ts HTTP $code  $u"
            done
            sleep 180
          done
