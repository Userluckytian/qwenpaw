name: url-pinger
on:
  schedule:
    - cron: "*/5 * * * *"      # 每 5 分钟一次（GitHub 官方支持的最小间隔，短任务更稳妥）
  workflow_dispatch: {}         # 支持手动触发
concurrency:
  group: url-pinger
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping 3 URLs
        run: |
          URLS=(
            "https://npc-tunnel-client.app.workbuddy.host/?sharecode=EREAFNURUR"
            "https://aa6fdf0bbd8ec5018.app.workbuddy.host/?sharecode=2YGOCFSQFH"
            "https://url-fetch-proxy.app.workbuddy.host/?sharecode=URA34JXSBU"
          )
          FAILS=0
          ts=$(date -u +"%F %T")
          for u in "${URLS[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$u")
            echo "$ts HTTP $code  $u"
            # 2xx/3xx 视为正常，其余视为失败
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              FAILS=$((FAILS+1))
              echo "::warning::访问失败：$u → HTTP $code"
            fi
          done
          if [ $FAILS -gt 0 ]; then
            echo "::error::本轮 $FAILS 个地址访问失败，请检查服务状态"
            exit 1   # job 标红 → 触发 GitHub 失败邮件（成功运行默认不发邮件）
          fi
          echo "3 个地址全部正常"
